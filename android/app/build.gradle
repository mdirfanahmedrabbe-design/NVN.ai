plugins {
    id 'com.android.application'
}

def ksPass = System.getenv('KEYSTORE_PASS')
if (ksPass == null || ksPass.trim().isEmpty()) ksPass = 'nvnpass'
def buildNum = System.getenv('BUILD_NUMBER')
def verCode = 1
if (buildNum != null && buildNum.trim().isInteger()) verCode = buildNum.trim().toInteger()

android {
    namespace 'com.archer.ai'
    compileSdk 34

    signingConfigs {
        release {
            storeFile file('nvn.keystore')
            storePassword ksPass
            keyAlias 'nvn'
            keyPassword ksPass
            storeType 'PKCS12'
        }
    }

    defaultConfig {
        applicationId "com.archer.ai"
        minSdk 24
        targetSdk 34
        versionCode verCode
        versionName "1.0"
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
